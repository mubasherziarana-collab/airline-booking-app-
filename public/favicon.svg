<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <!-- Rounded Background with Luxury Gradient -->
  <rect width="96" height="96" rx="22" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Glow -->
  <rect x="1.5" y="1.5" width="93" height="93" rx="20.5" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- High-Contrast Aerodynamic Airplane Silhouette -->
  <g transform="translate(18, 16) scale(1.25)">
    <!-- Main Plane Body -->
    <path d="M24 2 L28 14 L42 22 L42 26 L28 22 L28 36 L33 40 L33 44 L24 41 L15 44 L15 40 L20 36 L20 22 L6 26 L6 22 L20 14 Z" 
          fill="#FFFFFF" 
          filter="url(#dropGlow)"/>
    
    <!-- Wing Accent / Speed Trail -->
    <path d="M8 24 L2 28 L8 28 Z" fill="#93C5FD"/>
    <path d="M40 24 L46 28 L40 28 Z" fill="#93C5FD"/>
  </g>

  <!-- Gradients and Shadow Filters -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B57D0"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="dropGlow" x="0" y="0" width="50" height="50" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
</svg>
